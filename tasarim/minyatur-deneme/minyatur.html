<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Hemdem Minyatür · deneme karesi</title>
<!-- Deneme karesi. İlham (dil ve mantık): Lemo-Opuscar "Gilded Illumination" (kod MIT; bu dosya sıfırdan yazıldı, Opuscar kodu içermez)
     ve Osmanlı minyatür / tezhip geleneği. -->
<link rel="stylesheet" href="../../motor/node_modules/@fontsource-variable/fraunces/full.css">
<link rel="stylesheet" href="../../motor/node_modules/@fontsource-variable/fraunces/full-italic.css">
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(async () => {
const TR = 'Bir fincan kahvenin kırk yıl hatırı vardır KAHVEHÂNE içtin çevirdin ğüşöçİ';
await Promise.all(['500 50px', 'italic 500 50px', '600 26px'].map(f => document.fonts.load(f + ' "Fraunces Variable"', TR)));
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c'), g = cv.getContext('2d');

// --- rastgele (sabit tohum) ---
let seed = 11;
const R = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + R() * (b - a);

// --- minyatür pigmentleri ---
const INK = '#2a1a10';
const LAPIS = '#22379a', LAPIS_D = '#141f5a', LAPIS_L = '#3a52b8';
const VERM = '#c8321f', VERM_D = '#8c1f12';
const VERD = '#3f8f7a', VERD_D = '#2a5f51';
const TURQ = '#3b9ea6', TURQ_D = '#24676d';
const ROSE = '#e2b3a3', ROSE_D = '#b98172';
const LILAC = '#b3a3c4', LILAC_D = '#8676a0';
const SAGE = '#b9c99a', SAGE_D = '#8fa572';
const LEAF = '#4f8a45', LEAF_D = '#2f5c2c';
const WOOD = '#9a6a43', WOOD_D = '#6b4426';
const SKIN = '#ecc9a5', SKIN_D = '#c99a76';
const WHITE = '#f6efe0', VELLUM = '#efe2c4', VELLUM_D = '#d6c39c';

// --- dokular ---
function canvasOf(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }

function granular(base, dark, light, n = 9000, sz = 256) {
  return g.createPattern(canvasOf(sz, sz, (q) => {
    q.fillStyle = base; q.fillRect(0, 0, sz, sz);
    for (let i = 0; i < n; i++) {
      q.fillStyle = R() < .55 ? dark : light; q.globalAlpha = rr(.12, .38);
      const r = rr(.5, 1.6); q.beginPath(); q.arc(rr(0, sz), rr(0, sz), r, 0, TAU); q.fill();
    }
  }), 'repeat');
}

// altın varak: kareler, ekler, çatlaklar, kırmızı bole lekeleri
const goldCanvas = canvasOf(240, 240, (q, w, h) => {
  const S = 40;
  for (let y = 0; y < h; y += S) for (let x = -S; x < w + S; x += S) {
    const ox = (y / S) % 2 ? S / 2 : 0;
    const k = rr(-.10, .10);
    const c = (v) => Math.max(0, Math.min(255, Math.round(v * (1 + k))));
    q.fillStyle = `rgb(${c(201)},${c(154)},${c(62)})`;
    q.fillRect(x + ox, y, S, S);
    q.strokeStyle = 'rgba(90,55,10,.55)'; q.lineWidth = 1; q.strokeRect(x + ox + .5, y + .5, S - 1, S - 1);
    q.strokeStyle = 'rgba(255,230,160,.35)'; q.beginPath(); q.moveTo(x + ox + 2, y + 2); q.lineTo(x + ox + S - 2, y + 2); q.stroke();
  }
  for (let i = 0; i < 26; i++) { q.fillStyle = 'rgba(150,45,25,.55)'; q.beginPath(); q.arc(rr(0, w), rr(0, h), rr(.6, 1.8), 0, TAU); q.fill(); }
  for (let i = 0; i < 10; i++) { q.strokeStyle = 'rgba(80,45,10,.4)'; q.beginPath(); let x = rr(0, w), y = rr(0, h); q.moveTo(x, y); for (let j = 0; j < 4; j++) { x += rr(-8, 8); y += rr(-8, 8); q.lineTo(x, y); } q.stroke(); }
});
const GOLD = g.createPattern(goldCanvas, 'repeat');

const P_LAPIS = granular(LAPIS, LAPIS_D, LAPIS_L);
const P_SAGE = granular(SAGE, SAGE_D, '#dfe8c8', 7000);
const P_VELLUM = granular(VELLUM, VELLUM_D, '#fbf4e2', 5000);

// --- çizim yardımcıları ---
const P = (fn) => { const p = new Path2D(); fn(p); return p; };

// kapalı yumuşak yol (noktaların orta noktalarından)
function smooth(pts) {
  return P(p => {
    const n = pts.length, m = (i) => { const a = pts[i % n], b = pts[(i + 1) % n]; return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
    const s = m(n - 1); p.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const c = pts[i], e = m(i); p.quadraticCurveTo(c[0], c[1], e[0], e[1]); }
    p.closePath();
  });
}

// minyatür kalıbı: düz renk + içte koyu bant + mürekkep kontur
function shape(path, fill, rim, lw = 3, rimW = 10) {
  g.fillStyle = fill; g.fill(path);
  if (rim) { g.save(); g.clip(path); g.lineWidth = rimW; g.strokeStyle = rim; g.globalAlpha = .55; g.stroke(path); g.restore(); }
  g.lineWidth = lw; g.strokeStyle = INK; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(path);
}

// üstübeç (beyaz kurşun) çizgi ve noktalar
function hiLine(fn, w = 2.2, a = .85) { g.save(); g.strokeStyle = WHITE; g.globalAlpha = a; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); fn(g); g.stroke(); g.restore(); }
function triad(x, y, r = 2.6, c = WHITE) { g.fillStyle = c; for (const [dx, dy] of [[0, -r * 1.3], [-r * 1.2, r * .8], [r * 1.2, r * .8]]) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, TAU); g.fill(); } }
function pearls(x0, y0, x1, y1, n, r = 3) { g.fillStyle = WHITE; for (let i = 0; i <= n; i++) { const t = i / n; g.beginPath(); g.arc(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, r, 0, TAU); g.fill(); } }

// altın varak + (isteğe bağlı) içerden gelen ışık
function gold(path, lit = null, lw = 3) {
  g.save(); g.clip(path);
  g.fillStyle = GOLD; g.fill(path);
  if (lit) {
    const gr = g.createRadialGradient(lit.x, lit.y, 0, lit.x, lit.y, lit.r);
    gr.addColorStop(0, 'rgba(255,226,150,.85)'); gr.addColorStop(.5, 'rgba(240,190,90,.35)'); gr.addColorStop(1, 'rgba(240,190,90,0)');
    g.globalCompositeOperation = 'screen'; g.fillStyle = gr; g.fill(path);
  } else {
    g.fillStyle = 'rgba(60,30,5,.28)'; g.fill(path); // sönük varak
  }
  g.restore();
  g.lineWidth = lw; g.strokeStyle = INK; g.stroke(path);
}

function star8(x, y, r) { return P(p => { for (let i = 0; i < 16; i++) { const a = i / 16 * TAU - Math.PI / 2, rad = i % 2 ? r * .45 : r; const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad; i ? p.lineTo(px, py) : p.moveTo(px, py); } p.closePath(); }); }

function flash(x, y, r, a = 1) { g.save(); g.globalAlpha = a; g.strokeStyle = '#fff3cf'; g.lineWidth = 2; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - r, y); g.lineTo(x + r, y); g.moveTo(x, y - r); g.lineTo(x, y + r); g.stroke(); g.lineWidth = 1.2; const d = r * .5; g.beginPath(); g.moveTo(x - d, y - d); g.lineTo(x + d, y + d); g.moveTo(x - d, y + d); g.lineTo(x + d, y - d); g.stroke(); g.restore(); }

// ============ SAHNE ============
const X0 = 72, Y0 = 72, X1 = W - 72, Y1 = H - 72;
const PIC = P(p => p.rect(X0, Y0, X1 - X0, Y1 - Y0));
g.save(); g.clip(PIC);

// gökyüzü (lacivert, granüllü)
g.fillStyle = P_LAPIS; g.fillRect(X0, Y0, X1 - X0, 900);

// sönük altın yıldızlar
for (let i = 0; i < 38; i++) { const x = rr(X0 + 20, X1 - 20), y = rr(300, 800), r = rr(5, 11); gold(star8(x, y, r), null, 1.4); }

// çin bulutları (dalgalı, beyaz)
function cloud(x, y, w, n) {
  const p = P(p => {
    const step = w / n; p.moveTo(x, y);
    for (let i = 0; i < n; i++) { const cx = x + step * (i + .5), r = step / 2 * (i % 2 ? .9 : 1.15); p.arc(cx, y, r, Math.PI, 0); }
    p.quadraticCurveTo(x + w + 14, y + 12, x + w - 6, y + 16);
    for (let i = n - 1; i >= 0; i--) { const cx = x + step * (i + .5); p.quadraticCurveTo(cx + step * .2, y + 26, cx - step * .5, y + 16); }
    p.quadraticCurveTo(x - 16, y + 12, x, y);
  });
  shape(p, WHITE, '#9fb0d8', 2.2, 8);
  hiLine(q => { for (let i = 0; i < n; i++) { const cx = x + w / n * (i + .5); q.moveTo(cx - 8, y + 4); q.quadraticCurveTo(cx, y - 2, cx + 8, y + 4); } }, 1.4, .5);
}
cloud(120, 360, 230, 5); cloud(400, 450, 170, 4); cloud(560, 330, 130, 3);

// uzak süngerimsi kayalar (minyatür kayaları)
function rock(cx, cy, rx, ry, fill, rim, n = 11) {
  const pts = []; for (let i = 0; i < n; i++) { const a = Math.PI + i / (n - 1) * Math.PI; const k = rr(.78, 1.12); pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
  pts.push([cx + rx, cy + ry * .25]); pts.push([cx - rx, cy + ry * .25]);
  const p = smooth(pts); shape(p, fill, rim, 2.6, 12);
  for (let i = 0; i < 5; i++) triad(cx + rr(-rx * .6, rx * .6), cy + rr(-ry * .6, 0), 2.2);
}
rock(470, 860, 120, 170, LILAC, LILAC_D); rock(610, 880, 100, 130, ROSE, ROSE_D); rock(380, 900, 90, 110, '#c9b6d2', LILAC_D);

// zemin (yukarıdan bakılmış gibi eğik düzlem)
const ground = P(p => { p.moveTo(X0, 880); p.bezierCurveTo(300, 840, 700, 900, X1, 860); p.lineTo(X1, Y1); p.lineTo(X0, Y1); p.closePath(); });
g.fillStyle = P_SAGE; g.fill(ground); g.lineWidth = 3; g.strokeStyle = INK; g.stroke(ground);
// çiçek noktaları
for (let i = 0; i < 80; i++) { const x = rr(X0 + 20, X1 - 20), y = rr(920, 1550); if (x > 200 && x < 930 && y > 1180 && y < 1400) continue; triad(x, y, 2.2, R() < .5 ? WHITE : '#e4867a'); }

// servi
const servi = smooth([[545, 620], [575, 760], [590, 900], [580, 1000], [510, 1000], [500, 900], [515, 760]]);
shape(servi, '#2f6b48', '#1d4a30', 3, 14);
hiLine(q => { for (let y = 680; y < 980; y += 34) { q.moveTo(530, y); q.lineTo(560, y + 14); } }, 1.6, .55);

// kahvehane
const roof = P(p => { p.moveTo(84, 650); p.lineTo(500, 650); p.lineTo(452, 560); p.lineTo(132, 560); p.closePath(); });
shape(roof, VERM, VERM_D, 3, 12);
g.save(); g.clip(roof); g.strokeStyle = 'rgba(80,15,5,.55)'; g.lineWidth = 2; for (let y = 578; y < 650; y += 18) { for (let x = 90; x < 500; x += 22) { g.beginPath(); g.arc(x + (y % 36 ? 11 : 0), y, 11, 0, Math.PI); g.stroke(); } } g.restore();
const wall = P(p => p.rect(100, 650, 384, 540));
shape(wall, ROSE, ROSE_D, 3, 14);
// çini bandı
const band = P(p => p.rect(100, 660, 384, 34)); shape(band, TURQ, TURQ_D, 2.4, 6);
for (let x = 116; x < 480; x += 32) { g.fillStyle = WHITE; g.beginPath(); g.arc(x, 677, 4, 0, TAU); g.fill(); g.fillStyle = VERM; g.beginPath(); g.arc(x + 16, 677, 2.4, 0, TAU); g.fill(); }
// levha
const plaque = P(p => { p.moveTo(170, 708); p.lineTo(414, 708); p.lineTo(428, 730); p.lineTo(414, 752); p.lineTo(170, 752); p.lineTo(156, 730); p.closePath(); });
g.fillStyle = P_VELLUM; g.fill(plaque); g.lineWidth = 2.6; g.strokeStyle = INK; g.stroke(plaque);
// sivri kemerler
function arch(x, w, top, bot) { return P(p => { p.moveTo(x, bot); p.lineTo(x, top + w * .55); p.quadraticCurveTo(x, top + w * .1, x + w / 2, top); p.quadraticCurveTo(x + w, top + w * .1, x + w, top + w * .55); p.lineTo(x + w, bot); p.closePath(); }); }
for (const x of [122, 238, 354]) {
  const a = arch(x, 104, 790, 1170); shape(a, LAPIS_D, null, 3);
  g.save(); g.clip(a); g.fillStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < 300; i++) g.fillRect(rr(x, x + 104), rr(790, 1170), 1.4, 1.4); g.restore();
  hiLine(q => { q.moveTo(x + 6, 1160); q.lineTo(x + 6, 790 + 104 * .55); q.quadraticCurveTo(x + 6, 790 + 104 * .14, x + 52, 797); }, 2, .6);
}
// kemerlerin içinde sönük kandiller
for (const x of [174, 290, 406]) { g.strokeStyle = INK; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, 800); g.lineTo(x, 860); g.stroke(); gold(P(p => { p.moveTo(x - 12, 860); p.lineTo(x + 12, 860); p.lineTo(x + 6, 884); p.lineTo(x - 6, 884); p.closePath(); }), null, 1.6); }

// çınar gövdesi
const trunk = P(p => { p.moveTo(918, 1215); p.bezierCurveTo(930, 1050, 900, 900, 920, 760); p.lineTo(870, 700); p.lineTo(890, 690); p.lineTo(950, 740); p.lineTo(990, 660); p.lineTo(1006, 680); p.lineTo(975, 790); p.bezierCurveTo(985, 950, 1000, 1080, 1004, 1215); p.closePath(); });
shape(trunk, WOOD, WOOD_D, 3, 14);
hiLine(q => { q.moveTo(930, 1190); q.bezierCurveTo(938, 1060, 918, 920, 930, 790); }, 1.8, .5);
// dal (kandilin asılı olduğu)
const branch = P(p => { p.moveTo(900, 760); p.bezierCurveTo(820, 740, 760, 760, 700, 790); p.lineTo(702, 802); p.bezierCurveTo(760, 776, 830, 762, 905, 784); p.closePath(); });
shape(branch, WOOD, WOOD_D, 2.6, 6);
// çınar yaprak kümeleri
function crown(cx, cy, r) {
  const pts = []; const n = 22; for (let i = 0; i < n; i++) { const a = i / n * TAU; const k = i % 2 ? .86 : 1.04; pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k * .82]); }
  shape(smooth(pts), LEAF, LEAF_D, 2.8, 16);
  for (let i = 0; i < 9; i++) { const a = rr(0, TAU), d = rr(0, r * .7); triad(cx + Math.cos(a) * d, cy + Math.sin(a) * d * .8, 2.4); }
}
crown(930, 440, 120); crown(790, 520, 110); crown(1000, 600, 100); crown(860, 640, 95); crown(720, 650, 80);

// zincir ve kandil (ışığın kaynağı)
g.strokeStyle = INK; g.lineWidth = 1.6; g.beginPath(); g.moveTo(712, 798); g.lineTo(712, 900); g.stroke();
for (let y = 806; y < 900; y += 10) { g.beginPath(); g.ellipse(712, y, 2.5, 4, 0, 0, TAU); g.stroke(); }
const LAMP = { x: 712, y: 935 };
const glow = g.createRadialGradient(LAMP.x, LAMP.y, 0, LAMP.x, LAMP.y, 170);
glow.addColorStop(0, 'rgba(255,214,130,.40)'); glow.addColorStop(1, 'rgba(255,214,130,0)');
g.fillStyle = glow; g.beginPath(); g.arc(LAMP.x, LAMP.y, 170, 0, TAU); g.fill();
const lampTop = P(p => { p.moveTo(696, 902); p.lineTo(728, 902); p.lineTo(736, 914); p.lineTo(688, 914); p.closePath(); });
const lampBody = P(p => { p.moveTo(690, 914); p.lineTo(734, 914); p.lineTo(740, 948); p.lineTo(712, 972); p.lineTo(684, 948); p.closePath(); });
gold(lampTop, { x: 712, y: 935, r: 60 }, 2); gold(lampBody, { x: 712, y: 935, r: 60 }, 2.4);
g.fillStyle = 'rgba(255,240,200,.9)'; g.beginPath(); g.ellipse(712, 936, 7, 11, 0, 0, TAU); g.fill();
flash(712, 936, 18, .9);

// peyke (ahşap sedir) ve kilim
const top = P(p => { p.moveTo(250, 1235); p.lineTo(880, 1235); p.lineTo(912, 1302); p.lineTo(218, 1302); p.closePath(); });
const front = P(p => p.rect(218, 1302, 694, 74));
shape(front, WOOD, WOOD_D, 3, 12);
for (let x = 250; x < 900; x += 62) { g.strokeStyle = WOOD_D; g.lineWidth = 2; g.beginPath(); g.moveTo(x, 1308); g.lineTo(x, 1370); g.stroke(); }
shape(top, VERM, VERM_D, 3, 10);
g.save(); g.clip(top);
for (let x = 250; x < 920; x += 46) { const d = P(p => { p.moveTo(x, 1250); p.lineTo(x + 16, 1268); p.lineTo(x, 1286); p.lineTo(x - 16, 1268); p.closePath(); }); g.fillStyle = '#f0d9a6'; g.fill(d); g.strokeStyle = INK; g.lineWidth = 1.4; g.stroke(d); g.fillStyle = LAPIS; g.beginPath(); g.arc(x, 1268, 4, 0, TAU); g.fill(); }
g.restore();
pearls(230, 1296, 900, 1296, 44, 2.4);

// --- figürler ---
function figure(o) {
  const s = o.dir; // 1 = sağa bakıyor, -1 = sola
  const x = o.x, base = 1292;
  // diz (bağdaş) ve gövde
  const body = P(p => {
    p.moveTo(x - 58 * s, 1092);
    p.bezierCurveTo(x - 72 * s, 1150, x - 96 * s, 1210, x - 120 * s, 1262);
    p.quadraticCurveTo(x - 128 * s, base + 4, x - 96 * s, base + 4);
    p.lineTo(x + 104 * s, base + 4);
    p.quadraticCurveTo(x + 136 * s, base + 2, x + 118 * s, 1256);
    p.bezierCurveTo(x + 96 * s, 1214, x + 74 * s, 1150, x + 60 * s, 1092);
    p.quadraticCurveTo(x, 1072, x - 58 * s, 1092);
    p.closePath();
  });
  shape(body, o.coat, o.coatD, 3, 18);
  // kaftan önü ve kuşak
  hiLine(q => { q.moveTo(x + 8 * s, 1096); q.bezierCurveTo(x + 14 * s, 1160, x + 6 * s, 1220, x + 18 * s, base); }, 2.4, .8);
  const sash = P(p => { p.moveTo(x - 66 * s, 1190); p.quadraticCurveTo(x, 1206, x + 70 * s, 1188); p.lineTo(x + 74 * s, 1206); p.quadraticCurveTo(x, 1226, x - 70 * s, 1208); p.closePath(); });
  shape(sash, o.sash, null, 2.2);
  pearls(x - 60 * s, 1199, x + 64 * s, 1197, 10, 2);
  // kol ve el (tepsiye / fincana uzanıyor)
  const arm = P(p => { p.moveTo(x + 40 * s, 1102); p.bezierCurveTo(x + 90 * s, 1120, x + 120 * s, 1150, o.hx - 10 * s, o.hy - 6); p.lineTo(o.hx - 12 * s, o.hy + 16); p.bezierCurveTo(x + 100 * s, 1180, x + 70 * s, 1160, x + 34 * s, 1140); p.closePath(); });
  shape(arm, o.coat, o.coatD, 2.8, 10);
  const hand = P(p => p.ellipse(o.hx, o.hy + 5, 12, 10, 0, 0, TAU)); shape(hand, SKIN, SKIN_D, 2.2, 5);
  // boyun ve baş
  shape(P(p => p.rect(x - 12, 1060, 24, 30)), SKIN, SKIN_D, 2.4, 5);
  const head = P(p => p.ellipse(x + 4 * s, 1030, 36, 40, 0, 0, TAU));
  shape(head, SKIN, SKIN_D, 2.8, 8);
  // yüz (sade minyatür yüzü, üç çeyrek)
  const ex = x + 18 * s, ey = 1024;
  g.strokeStyle = INK; g.lineWidth = 2.2; g.beginPath(); g.moveTo(ex - 9, ey); g.quadraticCurveTo(ex, ey - 5, ex + 9, ey); g.stroke();
  g.fillStyle = INK; g.beginPath(); g.arc(ex + 2 * s, ey, 2.6, 0, TAU); g.fill();
  g.lineWidth = 2; g.beginPath(); g.moveTo(ex - 10, ey - 12); g.quadraticCurveTo(ex, ey - 18, ex + 11, ey - 12); g.stroke();
  g.beginPath(); g.moveTo(x + 34 * s, 1026); g.lineTo(x + 40 * s, 1040); g.lineTo(x + 32 * s, 1042); g.stroke();
  g.strokeStyle = '#a5523e'; g.beginPath(); g.moveTo(x + 22 * s, 1054); g.lineTo(x + 32 * s, 1053); g.stroke();
  if (o.beard) { const b = P(p => { p.moveTo(x - 20 * s, 1040); p.quadraticCurveTo(x - 6 * s, 1100, x + 18 * s, 1094); p.quadraticCurveTo(x + 40 * s, 1080, x + 38 * s, 1058); p.quadraticCurveTo(x + 20 * s, 1066, x - 2 * s, 1050); p.closePath(); }); shape(b, WHITE, '#c9c2b4', 2.4, 6); }
  // başlık
